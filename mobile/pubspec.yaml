name: orca_mobile
description: "ORCA: Marine EcOsystem Reasoning with Collaborative Agents (ISRO 26176)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Local Offline SQLite & Persistence
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Geospatial & Mapping
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_compass: ^0.8.0

  # Audio Capture & Playback
  record: ^5.2.1
  audioplayers: ^6.0.0

  # HTTP & Networking
  dio: ^5.4.1
  web_socket_channel: ^2.4.5

dependency_overrides:
  record_linux: 1.3.1

  # UI Utilities & Icons
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/boundaries/
    - assets/audio/
    - assets/icons/
